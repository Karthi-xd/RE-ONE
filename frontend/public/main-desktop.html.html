  /* ---------------- Desktop Icons ---------------- */
  #icon-layer{
    position:absolute;
    top:12px; left:12px;
    display:flex;
    flex-direction:column;
    flex-wrap:wrap;
    align-content:flex-start;
    height: calc(100vh - 60px);
    gap:2px;
  }

  .desktop-icon{
    width:78px;
    height:78px;
    margin:4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:4px;
    border:1px dotted transparent;
    cursor:default;
    text-align:center;
  }
  .desktop-icon.selected{
    background:rgba(50,90,180,0.35);
    border:1px dotted #fff;
  }
  .desktop-icon .icon-glyph{
    width:40px; height:34px;
    margin-bottom:4px;
    filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.6));
  }
  .desktop-icon .icon-label{
    color:#fff;
    font-size:11px;
    line-height:1.2;
    text-shadow: 1px 1px 2px #000, 0 0 2px #000;
    word-break: break-word;
  }
  .desktop-icon.selected .icon-label{
    background:#0a246a;
    text-shadow:none;
    padding:0 2px;
  }

  /* ---------------- Generic Window Chrome ---------------- */
  .win{
    position:absolute;
    min-width:280px;
    min-height:180px;
    background:var(--win-face);
    border: 1px solid #0a246a;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    display:flex;
    flex-direction:column;
    border-radius:8px 8px 0 0;
    overflow:hidden;
  }
  .win.maximized{
    border-radius:0;
  }
  .win.focused{ z-index:50; }
  .win.unfocused{ }

  .titlebar{
    height:26px;
    flex:0 0 26px;
    display:flex;
    align-items:center;
    padding:2px 3px 2px 6px;
    background: linear-gradient(180deg, var(--title-blue-2) 0%, var(--title-blue-1) 8%, var(--title-blue-1) 40%, var(--title-blue-2) 86%, var(--title-blue-3) 100%);
    color:#fff;
    font-weight:bold;
    font-size:12px;
    cursor: default;
    border-radius:7px 7px 0 0;
  }
  .win.unfocused .titlebar{
    background: linear-gradient(180deg, #8298a8 0%, #6b7f92 8%, #6b7f92 40%, #8298a8 86%, #b6c6d6 100%);
  }
  .titlebar .title-icon{
    width:16px; height:16px; margin-right:5px; flex:0 0 auto;
  }
  .titlebar .title-text{
    flex:1 1 auto;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    text-shadow: 1px 1px 1px rgba(0,0,0,0.4);
  }
  .titlebar .title-btns{
    display:flex;
    gap:2px;
    flex:0 0 auto;
  }
  .title-btn{
    width:20px; height:19px;
    background:var(--btn-face);
    border:1px solid #fff;
    border-right-color:#40506a;
    border-bottom-color:#40506a;
    border-radius:2px;
    font-size:11px;
    font-family: "Marlett", Arial, sans-serif;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:#111;
  }
  .title-btn:active{
    border-color:#40506a;
    border-right-color:#fff;
    border-bottom-color:#fff;
  }
  .title-btn.close-btn{
    background:#e04343;
    color:#fff;

<body>

<div id="desktop">
  <div id="icon-layer"></div>
</div>

<div id="start-menu">
  <div class="side-strip"></div>
  <div class="menu-col">
    <div class="menu-header">Historical Archive</div>
    <div class="start-item" data-open="rag"><span class="tb-icon">🔍</span> Historical RAG</div>
    <div class="start-item" data-open="2015"><span class="tb-icon">📁</span> 2015</div>
    <div class="start-item" data-open="2016"><span class="tb-icon">📁</span> 2016</div>
    <div class="start-item" data-open="2017"><span class="tb-icon">📁</span> 2017</div>
    <div class="start-item" data-open="2018"><span class="tb-icon">📁</span> 2018</div>
    <div class="start-item" data-open="2019"><span class="tb-icon">📁</span> 2019</div>
    <div class="start-item" data-open="2020"><span class="tb-icon">📁</span> 2020</div>
    <div class="start-item" data-open="mycomputer"><span class="tb-icon">🖥️</span> My Computer</div>
    <div class="start-item" data-open="mydocs"><span class="tb-icon">📄</span> My Documents</div>
  </div>
</div>

<div id="taskbar">
  <div id="start-btn"><span class="flag"></span> Start</div>
  <div id="taskbar-sep"></div>
  <div id="taskbar-items"></div>
  <div id="tray"><span id="clock">00:00</span></div>
</div>

<script>
/* ============================================================
   CONFIGURATION — connect this to your existing RAG backend
   ============================================================ */
const RAG_CONFIG = {
  // TODO: replace with your real backend endpoint, e.g.
  // "https://your-api.example.com/api/search"
  API_ENDPOINT: "http://127.0.0.1:8000/search",

  // Optional: add any headers your backend needs (auth tokens, etc).
  // Left empty on purpose — fill in if your API requires auth.
  HEADERS: {
    "Content-Type": "application/json"
  }
};

/**
 * searchRAG - the single integration point with your existing RAG backend.
 * Does NOT implement retrieval/embeddings/LLM logic itself — it only calls
 * your API and returns whatever it returns.
 *
 * Expected request:  POST { query: string, year: string|number }
 * Expected response: an array of result objects OR { results: [...] }.
 * Each result object is rendered flexibly - it will use whichever of these
 * fields are present: title, year, snippet/text/content, source/document.
 *
 * @param {string} query
 * @param {string|number} year  ("all" for no year filter)
 * @returns {Promise<Array<Object>>}
 */
async function searchRAG(query, year) {
  if (!RAG_CONFIG.API_ENDPOINT || RAG_CONFIG.API_ENDPOINT === "REPLACE_WITH_YOUR_RAG_API_ENDPOINT") {
    throw new Error(
      "RAG API endpoint is not configured. Set RAG_CONFIG.API_ENDPOINT in the script to your backend URL."
    );
  }

  const response = await fetch(RAG_CONFIG.API_ENDPOINT, {
    method: "POST",
    headers: RAG_CONFIG.HEADERS,
    body: JSON.stringify({ query, year })
  });

  if (!response.ok) {
    throw new Error(`RAG backend returned ${response.status}: ${response.statusText}`);
  }

  const data = await response.json();
  // Support either a raw array response or a { results: [...] } shape.
  return Array.isArray(data) ? data : (data.results || data.items || []);
}

/* ============================================================
   DESKTOP / WINDOW MANAGER
   ============================================================ */

const YEARS = ["2015","2016","2017","2018","2019","2020"];

const ICON_GLYPHS = {
  folder: `<svg viewBox="0 0 40 34" class="icon-glyph"><path d="M2 8 L2 30 L38 30 L38 10 L18 10 L15 6 L2 6 Z" fill="#f6c453" stroke="#8a5a00" stroke-width="1"/><path d="M2 8 L2 30 L38 30 L38 10 L2 10 Z" fill="#ffe07a" stroke="#8a5a00" stroke-width="1"/></svg>`,
  computer: `<svg viewBox="0 0 40 34" class="icon-glyph"><rect x="4" y="4" width="32" height="20" rx="1" fill="#c9d9ea" stroke="#4a5a6a"/><rect x="7" y="7" width="26" height="14" fill="#2a6ac1"/><rect x="12" y="26" width="16" height="4" fill="#9aa9b8" stroke="#4a5a6a"/></svg>`,
  recycle: `<svg viewBox="0 0 40 34" class="icon-glyph"><path d="M12 10 L28 10 L26 30 L14 30 Z" fill="#e8ecef" stroke="#556" stroke-width="1"/><rect x="9" y="6" width="22" height="4" fill="#b9c2cc" stroke="#556"/><rect x="16" y="2" width="8" height="4" fill="#b9c2cc" stroke="#556"/></svg>`,
  docs: `<svg viewBox="0 0 40 34" class="icon-glyph"><path d="M9 2 L25 2 L31 8 L31 32 L9 32 Z" fill="#fefefe" stroke="#5578b0"/><path d="M25 2 L25 8 L31 8 Z" fill="#c8d8f0"/><line x1="12" y1="14" x2="27" y2="14" stroke="#8aa4cc"/><line x1="12" y1="19" x2="27" y2="19" stroke="#8aa4cc"/><line x1="12" y1="24" x2="27" y2="24" stroke="#8aa4cc"/></svg>`,
  rag: `<svg viewBox="0 0 40 34" class="icon-glyph"><circle cx="17" cy="14" r="10" fill="#dcebff" stroke="#0a246a" stroke-width="2"/><line x1="24" y1="21" x2="34" y2="31" stroke="#0a246a" stroke-width="4" stroke-linecap="round"/><circle cx="17" cy="14" r="5" fill="#3a6ea5"/></svg>`
};

const state = {
  windows: {},   // id -> {el, minimized, maximized, prevRect, zIndex}
  zTop: 10,
  focused: null
};

function pad(n){ return n.toString().padStart(2,"0"); }
function updateClock(){
  const d = new Date();
  let h = d.getHours();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  document.getElementById("clock").textContent = `${h}:${pad(d.getMinutes())} ${ampm}`;
}
updateClock();
setInterval(updateClock, 15000);

/* ---------- Desktop icon setup ---------- */
const desktopIcons = [
  { id:"mycomputer", label:"My Computer", glyph:"computer" },
  { id:"mydocs", label:"My Documents", glyph:"docs" },
  { id:"rag", label:"Historical RAG", glyph:"rag" },
  ...YEARS.map(y => ({ id:y, label:y, glyph:"folder" })),
  { id:"recyclebin", label:"Recycle Bin", glyph:"recycle" }
];

const iconLayer = document.getElementById("icon-layer");
desktopIcons.forEach(ic => {
  const el = document.createElement("div");
  el.className = "desktop-icon";
  el.dataset.id = ic.id;
  el.innerHTML = `${ICON_GLYPHS[ic.glyph]}<div class="icon-label">${ic.label}</div>`;
  el.addEventListener("click", (e) => {
    document.querySelectorAll(".desktop-icon").forEach(i => i.classList.remove("selected"));
    el.classList.add("selected");
    e.stopPropagation();
  });
  el.addEventListener("dblclick", () => openApp(ic.id));
  iconLayer.appendChild(el);
});
document.getElementById("desktop").addEventListener("click", () => {
  document.querySelectorAll(".desktop-icon").forEach(i => i.classList.remove("selected"));
  closeStartMenu();
});

/* ---------- Start menu ---------- */
const startMenu = document.getElementById("start-menu");
document.getElementById("start-btn").addEventListener("click", (e) => {
  startMenu.classList.toggle("open");
  e.stopPropagation();
});
function closeStartMenu(){ startMenu.classList.remove("open"); }
startMenu.querySelectorAll(".start-item").forEach(item => {
  item.addEventListener("click", () => {
    openApp(item.dataset.open);
    closeStartMenu();
  });
});

/* ---------- Window factory ---------- */
let winCounter = 0;

function createWindow({ id, title, iconGlyph, width, height, x, y, bodyHTML, onMount }) {
  if (state.windows[id] && document.body.contains(state.windows[id].el)) {
    restoreWindow(id);
    focusWindow(id);
    return state.windows[id];
  }

  winCounter++;
  const el = document.createElement("div");
  el.className = "win focused";
  el.style.width = width + "px";
  el.style.height = height + "px";
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.zIndex = ++state.zTop;

  el.innerHTML = `
    <div class="titlebar">
      <span class="title-icon">${ICON_GLYPHS[iconGlyph] || ""}</span>
      <span class="title-text">${title}</span>
      <div class="title-btns">
        <div class="title-btn min-btn" title="Minimize">&#128469;</div>
        <div class="title-btn max-btn" title="Maximize">&#9723;</div>
        <div class="title-btn close-btn" title="Close">&#10005;</div>
      </div>
    </div>
    <div class="win-content" style="flex:1 1 auto; display:flex; flex-direction:column; min-height:0;">
      ${bodyHTML}
    </div>
    <div class="resize-handle"></div>
  `;

  document.getElementById("desktop").appendChild(el);

  state.windows[id] = { el, minimized:false, maximized:false, prevRect:null, title, iconGlyph };

  // Title bar drag
  const titlebar = el.querySelector(".titlebar");
  makeDraggable(el, titlebar);

  // Buttons
  el.querySelector(".close-btn").addEventListener("click", (e) => { e.stopPropagation(); closeWindow(id); });
  el.querySelector(".min-btn").addEventListener("click", (e) => { e.stopPropagation(); minimizeWindow(id); });
  el.querySelector(".max-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleMaximize(id); });
  titlebar.addEventListener("dblclick", () => toggleMaximize(id));

  // Focus on mousedown
  el.addEventListener("mousedown", () => focusWindow(id));

  // Resize handle
  makeResizable(el);

  addTaskbarItem(id, title, iconGlyph);
  focusWindow(id);

  if (onMount) onMount(el);
  return state.windows[id];
}

function focusWindow(id){
  const w = state.windows[id];
  if (!w) return;
  document.querySelectorAll(".win").forEach(el => { el.classList.remove("focused"); el.classList.add("unfocused"); });
  w.el.classList.add("focused");
  w.el.classList.remove("unfocused");
  w.el.style.zIndex = ++state.zTop;
  state.focused = id;
  document.querySelectorAll(".taskbar-item").forEach(t => t.classList.remove("active"));
  const tb = document.getElementById("task-" + id);
  if (tb) tb.classList.add("active");
}

function closeWindow(id){
  const w = state.windows[id];
  if (!w) return;
  w.el.remove();
  const tb = document.getElementById("task-" + id);
  if (tb) tb.remove();
  delete state.windows[id];
}

function minimizeWindow(id){
  const w = state.windows[id];
  if (!w) return;
  w.el.style.display = "none";
  w.minimized = true;
  const tb = document.getElementById("task-" + id);
  if (tb) tb.classList.remove("active");
}

function restoreWindow(id){
  const w = state.windows[id];
  if (!w) return;
  w.el.style.display = "flex";
  w.minimized = false;
  focusWindow(id);
}

function toggleMaximize(id){
  const w = state.windows[id];
  if (!w) return;
  const el = w.el;
  if (!w.maximized){
    w.prevRect = { left:el.style.left, top:el.style.top, width:el.style.width, height:el.style.height };
    el.style.left = "0px";
    el.style.top = "0px";
    el.style.width = "100vw";
    el.style.height = "calc(100vh - 32px)";
    el.classList.add("maximized");
    w.maximized = true;
  } else {
    el.style.left = w.prevRect.left;
    el.style.top = w.prevRect.top;
    el.style.width = w.prevRect.width;
    el.style.height = w.prevRect.height;
    el.classList.remove("maximized");
    w.maximized = false;
  }
}

function makeDraggable(el, handle){
  let dragging = false, startX, startY, origLeft, origTop;
  handle.addEventListener("mousedown", (e) => {
    if (e.target.closest(".title-btn")) return;
    const w = state.windows[Object.keys(state.windows).find(k => state.windows[k].el === el)];
    if (w && w.maximized) return;
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    origLeft = el.offsetLeft; origTop = el.offsetTop;
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    let nx = origLeft + (e.clientX - startX);
    let ny = origTop + (e.clientY - startY);
    ny = Math.max(0, Math.min(ny, window.innerHeight - 32));
    el.style.left = nx + "px";
    el.style.top = ny + "px";
  });
  window.addEventListener("mouseup", () => { dragging = false; });
}

function makeResizable(el){
  const handle = el.querySelector(".resize-handle");
  let resizing = false, startX, startY, startW, startH;
  handle.addEventListener("mousedown", (e) => {
    resizing = true;
    startX = e.clientX; startY = e.clientY;
    startW = el.offsetWidth; startH = el.offsetHeight;
    e.preventDefault();
    e.stopPropagation();
  });
  window.addEventListener("mousemove", (e) => {
    if (!resizing) return;
    const w = Math.max(280, startW + (e.clientX - startX));
    const h = Math.max(180, startH + (e.clientY - startY));
    el.style.width = w + "px";
    el.style.height = h + "px";
  });
  window.addEventListener("mouseup", () => { resizing = false; });
}

/* ---------- Taskbar items ---------- */
function addTaskbarItem(id, title, iconGlyph){
  if (document.getElementById("task-" + id)) return;
  const item = document.createElement("div");
  item.className = "taskbar-item active";
  item.id = "task-" + id;
  item.innerHTML = `<span class="tb-icon" style="display:inline-flex">${ICON_GLYPHS[iconGlyph] || ""}</span><span>${title}</span>`;
  item.addEventListener("click", () => {
    const w = state.windows[id];
    if (!w) return;
    if (w.minimized) { restoreWindow(id); }
    else if (state.focused === id) { minimizeWindow(id); }
    else { focusWindow(id); }
  });
  document.getElementById("taskbar-items").appendChild(item);
}

/* ============================================================
   APP DEFINITIONS
   ============================================================ */

let nextWinX = 90, nextWinY = 60;
function cascadePos(){
  const pos = { x: nextWinX, y: nextWinY };
  nextWinX = (nextWinX + 34) % 420 + 60;
  nextWinY = (nextWinY + 28) % 260 + 50;
  return pos;
}

function openApp(id){
  if (YEARS.includes(id)) return openYearFolder(id);
  switch(id){
    case "rag": return openRagApp();
    case "mycomputer": return openMyComputer();
    case "mydocs": return openYearFolder(null, "My Documents");
    case "recyclebin": return openRecycleBin();
  }
}

/* ---- Explorer-style year folder window ---- */
function openYearFolder(year, customTitle){
  const id = year ? `folder-${year}` : "mydocs";
  const title = customTitle || `${year} - Historical Archive`;
  const pos = cascadePos();

  const sidebarYears = YEARS.map(y =>
    `<li data-year="${y}" style="${y===year ? 'font-weight:bold;text-decoration:underline;' : ''}">${y}</li>`
  ).join("");

  const bodyHTML = `
    <div class="menubar">
      <span>File</span><span>Edit</span><span>View</span><span>Favorites</span><span>Tools</span><span>Help</span>
    </div>
    <div class="toolbar">
      <button class="win-btn" style="padding:3px 8px;">&#8592; Back</button>
      <button class="win-btn" style="padding:3px 8px;">&#8594;</button>
      <div class="addressbar">
        <span>&#128193;</span>
        <input type="text" readonly value="C:\\Historical Archive\\${year || 'My Documents'}">
      </div>
    </div>
    <div class="win-body">
      <div class="explorer-body">
        <div class="explorer-sidebar">
          <h3>Folders</h3>
          <ul>${sidebarYears}</ul>
          <h3>Also try</h3>
          <ul><li data-open="rag">Historical RAG</li></ul>
        </div>
        <div class="explorer-main" id="files-${id}">
          <div class="empty-folder-msg">Loading contents from archive…</div>
        </div>
      </div>
    </div>
    <div class="statusbar"><span id="status-${id}">Ready</span></div>
  `;

  createWindow({
    id, title, iconGlyph: "folder",
    width: 620, height: 420, x: pos.x, y: pos.y,
    bodyHTML,
    onMount: (el) => {
      el.querySelectorAll(".explorer-sidebar li[data-year]").forEach(li => {
        li.addEventListener("click", () => openYearFolder(li.dataset.year));
      });
      el.querySelectorAll(".explorer-sidebar li[data-open]").forEach(li => {
        li.addEventListener("click", () => openApp(li.dataset.open));
      });
      renderYearFolderContents(id, year);
    }
  });
}

/**
 * Renders the "files" inside a year folder. This is a lightweight,
 * non-RAG placeholder listing — it does NOT call the RAG backend.
 * If you want real per-year document listings here, wire this function
 * to a separate "list documents by year" endpoint of your backend.
 */
function renderYearFolderContents(id, year){
  const container = document.getElementById(`files-${id}`);
  const statusEl = document.getElementById(`status-${id}`);
  if (!container) return;

  if (!year){
    container.innerHTML = `<div class="empty-folder-msg">This folder is empty. Try a year folder or Historical RAG.</div>`;
    if (statusEl) statusEl.textContent = "0 items";
    return;
  }

  // Placeholder representative entries per year — replace/populate from
  // your backend's document-listing endpoint if one exists.
  const items = [
    { name: `${year}_records.pdf`, glyph: "📄" },
    { name: `${year}_summary.docx`, glyph: "📝" },
    { name: `${year}_dataset.csv`, glyph: "📊" },
  ];

  container.innerHTML = items.map(it => `
    <div class="file-item">
      <div class="file-glyph">${it.glyph}</div>
      <div class="file-name">${it.name}</div>
    </div>
  `).join("") + `
    <div class="file-item" data-open-rag="${year}">
      <div class="file-glyph">🔍</div>
      <div class="file-name">Search ${year} in RAG…</div>
    </div>
  `;

  const ragTile = container.querySelector(`[data-open-rag]`);
  if (ragTile){
    ragTile.style.cursor = "pointer";
    ragTile.addEventListener("dblclick", () => {
      openRagApp(year);
    });
    ragTile.addEventListener("click", (e) => e.stopPropagation());
  }

  if (statusEl) statusEl.textContent = `${items.length + 1} items`;
}

/* ---- Historical RAG application window ---- */
function openRagApp(prefillYear){
  const id = "rag";
  const pos = cascadePos();

  const yearOptions = `<option value="all">All years</option>` +
    YEARS.map(y => `<option value="${y}" ${prefillYear===y?"selected":""}>${y}</option>`).join("");

  const bodyHTML = `
    <div class="menubar">
      <span>File</span><span>Edit</span><span>Search</span><span>Help</span>
    </div>
    <div class="win-body">
      <div class="rag-body">
        <div class="rag-panel">
          <div class="rag-row">
            <label for="rag-query">Question:</label>
            <input type="text" id="rag-query" class="win-input" placeholder="Ask something about the historical archive…">
          </div>
          <div class="rag-row">
            <label for="rag-year">Year:</label>
            <select id="rag-year" class="win-select">${yearOptions}</select>
            <button id="rag-search-btn" class="win-btn">Search</button>
          </div>
          <div class="rag-status" id="rag-status">Enter a question and press Search.</div>
        </div>
        <div class="rag-panel" id="rag-results-panel" style="display:none;">
          <div class="rag-results-title">Results</div>
          <div id="rag-results"></div>
        </div>
      </div>
    </div>
    <div class="statusbar"><span id="rag-statusbar">Ready</span></div>
  `;

  createWindow({
    id, title: "Historical RAG", iconGlyph: "rag",
    width: 560, height: 460, x: pos.x, y: pos.y,
    bodyHTML,
    onMount: (el) => {
      const queryInput = el.querySelector("#rag-query");
      const yearSelect = el.querySelector("#rag-year");
      const searchBtn = el.querySelector("#rag-search-btn");
      const statusEl = el.querySelector("#rag-status");
      const statusBar = el.querySelector("#rag-statusbar");
      const resultsPanel = el.querySelector("#rag-results-panel");
      const resultsEl = el.querySelector("#rag-results");

      async function runSearch(){
        const query = queryInput.value.trim();
        const year = yearSelect.value;
        if (!query){
          statusEl.textContent = "Please enter a question first.";
          statusEl.classList.add("error");
          return;
        }
        statusEl.classList.remove("error");
        statusEl.textContent = "Searching the archive…";
        statusBar.textContent = "Searching…";
        searchBtn.disabled = true;
        resultsPanel.style.display = "none";

        try {
          const results = await searchRAG(query, year);
          renderRagResults(resultsEl, results);
          resultsPanel.style.display = "block";
          statusEl.textContent = `Found ${results.length} result${results.length===1?"":"s"}.`;
          statusBar.textContent = "Search complete.";
        } catch (err) {
          statusEl.classList.add("error");
          statusEl.textContent = "Search failed: " + err.message;
          statusBar.textContent = "Error.";
        } finally {
          searchBtn.disabled = false;
        }
      }

      searchBtn.addEventListener("click", runSearch);
      queryInput.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
    }
  });
}

function renderRagResults(container, results){
  if (!results || results.length === 0){
    container.innerHTML = `<div class="empty-folder-msg">No results found for that question.</div>`;
    return;
  }
  container.innerHTML = results.map(r => {
    const title = r.title || r.heading || "Untitled result";
    const year = r.year || r.date || "";
    const snippet = r.snippet || r.text || r.content || "";
    const source = r.source || r.document || r.doc || r.filename || "";
    return `
      <div class="result-card">
        <h4>${escapeHTML(title)}</h4>
        <div class="result-meta">
          ${year ? `<span>Year: ${escapeHTML(String(year))}</span>` : ""}
        </div>
        <div class="result-snippet">${escapeHTML(snippet)}</div>
        ${source ? `<div class="result-source">Source: ${escapeHTML(String(source))}</div>` : ""}
      </div>
    `;
  }).join("");
}

function escapeHTML(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
